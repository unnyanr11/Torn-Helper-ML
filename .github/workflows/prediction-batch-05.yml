name: Python stock prediction batch 05 (stocks 25–30)

on:
  workflow_dispatch:
    inputs:
      force_train:
        description: Force model retraining for this batch
        required: true
        default: false
        type: boolean
      force_calibrate:
        description: Force calibration for this batch
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  retrigger:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Wait five minutes, then dispatch this prediction batch again
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sleep 300
          curl --fail-with-body --silent --show-error \\
            --retry 5 \\
            --retry-all-errors \\
            --retry-delay 5 \\
            --retry-max-time 90 \\
            --connect-timeout 15 \\
            --max-time 30 \\
            --request POST \\
            --header "Authorization: Bearer $GH_TOKEN" \\
            --header "Accept: application/vnd.github+json" \\
            --header "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/prediction-batch-05.yml/dispatches" \\
            --data '{"ref":"main","inputs":{"force_train":"true","force_calibrate":"false"}}'

  run-batch:
    uses: ./.github/workflows/prediction-batch-reusable.yml
    with:
      batch_id: "05"
      project_numbers: "13,14,15"
      force_train: ${{ inputs.force_train }}
      force_calibrate: ${{ inputs.force_calibrate }}
    secrets: inherit
