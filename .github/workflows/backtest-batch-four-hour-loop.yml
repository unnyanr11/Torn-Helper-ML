name: Trigger all backtest and calibration batches every 4 hours

on:
  schedule:
    # GitHub cron uses UTC. Runs at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
    # Equivalent to 05:30, 09:30, 13:30, 17:30, 21:30, 01:30 IST.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Historical lookback days (30-180)
        required: true
        default: "180"
        type: string
      evaluation_days:
        description: Evaluation days (0 = all eligible history)
        required: true
        default: "0"
        type: string
      max_folds:
        description: Maximum walk-forward folds
        required: true
        default: "30"
        type: string
      backtest_workers:
        description: Python worker processes per batch (1-4)
        required: true
        default: "2"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: torn-helper-ml-four-hour-backtest-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '180' }}
      EVALUATION_DAYS: ${{ inputs.evaluation_days || '0' }}
      MAX_FOLDS: ${{ inputs.max_folds || '30' }}
      BACKTEST_WORKERS: ${{ inputs.backtest_workers || '2' }}
    steps:
      - name: Validate settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]] && (( LOOKBACK_DAYS >= 30 && LOOKBACK_DAYS <= 180 ))
          [[ "$EVALUATION_DAYS" =~ ^[0-9]+$ ]] && (( EVALUATION_DAYS >= 0 && EVALUATION_DAYS < LOOKBACK_DAYS ))
          [[ "$MAX_FOLDS" =~ ^[0-9]+$ ]] && (( MAX_FOLDS >= 1 && MAX_FOLDS <= 1000 ))
          [[ "$BACKTEST_WORKERS" =~ ^[0-9]+$ ]] && (( BACKTEST_WORKERS >= 1 && BACKTEST_WORKERS <= 4 ))
      - name: Trigger all nine backtest batches
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg lookback "$LOOKBACK_DAYS" \
            --arg evaluation "$EVALUATION_DAYS" \
            --arg folds "$MAX_FOLDS" \
            --arg workers "$BACKTEST_WORKERS" \
            '{ref:"main",inputs:{lookback_days:$lookback,evaluation_days:$evaluation,max_folds:$folds,backtest_workers:$workers}}')"
          for batch in 01 02 03 04 05 06 07 08 09; do
            echo "Dispatching backtest batch $batch"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
              --connect-timeout 15 --max-time 30 \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/backtest-batch-$batch.yml/dispatches" \
              --data "$payload"
          done
