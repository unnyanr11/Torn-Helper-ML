name: Python stock prediction batch 04 (stocks 19–24)

on:
  workflow_dispatch:
    inputs:
      force_train:
        description: Force model retraining for this batch
        required: true
        default: false
        type: boolean
      force_calibrate:
        description: Force calibration for this batch
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-batch:
    uses: ./.github/workflows/prediction-batch-reusable.yml
    with:
      batch_id: "04"
      project_numbers: "10,11,12"
      force_train: ${{ inputs.force_train }}
      force_calibrate: ${{ inputs.force_calibrate }}
    secrets: inherit
