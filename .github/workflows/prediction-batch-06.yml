name: Python stock prediction batch 06 (stocks 31–35)

on:
  workflow_dispatch:
    inputs:
      force_train:
        description: Force model retraining for this batch
        required: true
        default: false
        type: boolean
      force_calibrate:
        description: Force calibration for this batch
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  retrigger:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Wait five minutes, then dispatch this prediction batch again
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sleep 120
          curl --fail-with-body --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 90 \
            --connect-timeout 15 \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/prediction-batch-06.yml/dispatches" \
            --data '{"ref":"main","inputs":{"force_train":"true","force_calibrate":"true"}}'

  run-batch:
    uses: ./.github/workflows/prediction-batch-reusable.yml
    with:
      batch_id: "06"
      project_numbers: "16,17,18"
      force_train: ${{ inputs.force_train }}
      force_calibrate: ${{ inputs.force_calibrate }}
    secrets: inherit
