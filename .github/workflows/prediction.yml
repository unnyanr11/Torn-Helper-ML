name: Python stock predictions

on:
  workflow_dispatch:
    inputs:
      force_train:
        description: Retrain all configured stock models now
        type: boolean
        default: false
      force_calibrate:
        description: Recheck and calibrate completed forecasts now
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Each run starts an independent five-minute timer. It dispatches the next
# run five minutes after this timer job starts, regardless of prediction duration.
# Shard-level PostgreSQL advisory leases prevent duplicate processing.
jobs:
  retrigger:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Wait five minutes from this run's start, then dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sleep 300
          curl --fail-with-body --silent --show-error \\
            --request POST \\
            --header "Authorization: Bearer $GH_TOKEN" \\
            --header "Accept: application/vnd.github+json" \\
            --header "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/prediction.yml/dispatches" \\
            --data '{"ref":"main","inputs":{"force_train":"true"}}'

  predict:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check configuration
        id: config
        env:
          PROJECTS: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
        run: |
          if [ -z "$PROJECTS" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::error::Add STOCK_ML_PROJECTS_JSON to repository Actions secrets.'
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Test prediction worker and models
        run: python -m unittest discover -s python/stock_ml -v
      - name: Restore public market-price cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .stock-ml-price-cache
          key: stock-market-prices-v1-${{ github.run_id }}
          restore-keys: stock-market-prices-v1-
      - name: Train when due, calibrate when due, and publish predictions
        id: cycle
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          ML_FORCE_TRAIN: ${{ inputs.force_train || false }}
          ML_FORCE_CALIBRATE: ${{ inputs.force_calibrate || false }}
          GITHUB_SHA: ${{ github.sha }}
        run: python python/stock_ml/actions_runner.py
      - name: Save public market-price cache at most hourly
        if: always() && !cancelled() && steps.cycle.outputs.cache_save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .stock-ml-price-cache
          key: stock-market-prices-v1-${{ github.run_id }}
