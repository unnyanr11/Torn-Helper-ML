name: Python stock predictions

on:
  workflow_dispatch:
    inputs:
      force_train:
        description: Retrain all configured stock models now
        type: boolean
        default: false
      force_calibrate:
        description: Recheck and calibrate completed forecasts now
        type: boolean
        default: false

permissions:
  contents: read

# Dispatch six independent prediction batches. Each batch owns a fixed set of
# three Supabase projects (six stocks); shard advisory locks remain the final
# guard against overlapping cycles.
jobs:
  predict:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        batch: [1, 2, 3, 4, 5, 6]
    name: Prediction batch ${{ matrix.batch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check configuration
        env:
          PROJECTS: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
        run: |
          if [ -z "$PROJECTS" ]; then
            echo '::error::Add STOCK_ML_PROJECTS_JSON to repository Actions secrets.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Test prediction worker and models
        run: python -m unittest discover -s python/stock_ml -v
      - name: Restore public market-price cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .stock-ml-price-cache
          key: stock-market-prices-v1-${{ github.run_id }}-${{ matrix.batch }}
          restore-keys: stock-market-prices-v1-
      - name: Run assigned prediction batch
        id: cycle
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          SHORT_MIN_EXPECTED_NET_RETURN: ${{ vars.SHORT_MIN_EXPECTED_NET_RETURN || '0.002' }}
          SHORT_ESTIMATED_TRADING_COST: ${{ vars.SHORT_ESTIMATED_TRADING_COST || '0.002' }}
          ML_FORCE_TRAIN: ${{ inputs.force_train || false }}
          ML_FORCE_CALIBRATE: ${{ inputs.force_calibrate || false }}
          PREDICTION_BATCH: ${{ matrix.batch }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          config = json.loads(os.environ["STOCK_ML_PROJECTS_JSON"])
          batch = int(os.environ["PREDICTION_BATCH"])
          allowed = set(range((batch - 1) * 3 + 1, min(batch * 3, 18) + 1))
          selected = {str(k): v for k, v in config.items() if int(k) in allowed}
          if not selected:
              print(f"No configured projects assigned to prediction batch {batch}", file=sys.stderr)
              sys.exit(1)
          env = os.environ.copy()
          env["STOCK_ML_PROJECTS_JSON"] = json.dumps(selected)
          raise SystemExit(subprocess.call([sys.executable, "python/stock_ml/actions_runner.py"], env=env))
          PY
      - name: Save public market-price cache at most hourly
        if: always() && !cancelled() && steps.cycle.outputs.cache_save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .stock-ml-price-cache
          key: stock-market-prices-v1-${{ github.run_id }}-${{ matrix.batch }}
