name: Python tests

on:
  push:
    branches: [main]
    paths:
      - 'python/stock_ml/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/backtest.yml'
      - '.github/workflows/prediction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/stock_ml/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/backtest.yml'
      - '.github/workflows/prediction.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - run: python -m pip install -r python/stock_ml/requirements.txt
      - run: python -m unittest discover -s python/stock_ml -v
