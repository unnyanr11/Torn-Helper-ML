name: Walk-forward stock backtests

on:
  workflow_dispatch:
    inputs:
      stock_ids:
        description: Stock IDs to test (start with 1)
        required: true
        default: "1"
        type: string
      lookback_days:
        description: Historical lookback in days (max 180)
        required: true
        default: "30"
        type: string
      evaluation_days:
        description: Out-of-sample evaluation period in days
        required: true
        default: "5"
        type: string
      max_folds:
        description: Maximum walk-forward folds per stock
        required: true
        default: "2"
        type: string
  # Backtests are manual-only until the prediction pipeline is stable.

permissions:
  contents: read
concurrency:
  group: torn-helper-ml-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - run: python -m pip install -r python/stock_ml/requirements.txt
      - run: python -m unittest discover -s python/stock_ml -v
      - name: Run walk-forward backtests
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          STOCK_IDS: ${{ inputs.stock_ids }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '180' }}
          EVALUATION_DAYS: ${{ inputs.evaluation_days || '15' }}
          MAX_FOLDS: ${{ inputs.max_folds || '20' }}
          GITHUB_SHA: ${{ github.sha }}
        run: python python/stock_ml/backtest_runner.py
