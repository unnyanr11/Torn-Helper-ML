name: Walk-forward stock backtests

on:
  workflow_dispatch:
    inputs:
      stock_ids:
        description: Comma-separated stock IDs (1-35); blank means all configured
        required: false
        type: string
      lookback_days:
        description: Historical lookback in days (max 180)
        required: true
        default: "180"
        type: string
      max_folds:
        description: Maximum walk-forward folds per stock
        required: true
        default: "3"
        type: string
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: read
concurrency:
  group: torn-helper-ml-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - run: python -m pip install -r python/stock_ml/requirements.txt
      - run: python -m unittest discover -s python/stock_ml -v
      - name: Run walk-forward backtests
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          STOCK_IDS: ${{ inputs.stock_ids }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '180' }}
          MAX_FOLDS: ${{ inputs.max_folds || '3' }}
          GITHUB_SHA: ${{ github.sha }}
        run: python python/stock_ml/backtest_runner.py
