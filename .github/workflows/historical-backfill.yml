name: Aggressive minute-price backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical minute window to backfill (maximum 365 days)
        type: choice
        options:
          - "365"
          - "180"
          - "90"
          - "30"
          - "14"
          - "7"
        default: "365"
        required: true
      dry_run:
        description: Fetch and validate history without writing to shard databases
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: stock-minute-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.repository == 'unnyanr11/Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Test backfill validation and paging
        run: python -m unittest python.stock_ml.test_historical_backfill -v
      - name: Backfill assigned stocks into SG1-SG18
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          BACKFILL_DAYS: ${{ inputs.days }}
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--days "$BACKFILL_DAYS")
          if [ "$BACKFILL_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python python/stock_ml/historical_backfill.py "${args[@]}"
