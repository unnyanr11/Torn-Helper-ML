name: Test six-stock Python prediction benchmark

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Historical data window (30-180 days)
        required: true
        default: "180"
        type: string
      max_training_rows:
        description: Training origins per selector (240-10000)
        required: true
        default: "3000"
        type: string

permissions:
  contents: read

concurrency:
  group: six-stock-python-prediction-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark six stocks with six different algorithms
    if: github.repository == 'unnyanr11/Torn-Helper-ML'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Validate configuration
        env:
          PROJECTS: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MAX_TRAINING_ROWS: ${{ inputs.max_training_rows }}
        run: |
          test -n "$PROJECTS" || { echo "::error::Missing STOCK_ML_PROJECTS_JSON"; exit 1; }
          python - <<'PY'
          import os
          lookback, rows = int(os.environ["LOOKBACK_DAYS"]), int(os.environ["MAX_TRAINING_ROWS"])
          if not 30 <= lookback <= 180 or not 240 <= rows <= 10000:
              raise SystemExit("Invalid benchmark inputs")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Compile benchmark script
        run: python -m py_compile python/stock_ml/benchmark_prediction.py
      - name: Run stock prediction unit tests
        run: python -m unittest discover -s python/stock_ml -v
      - name: Benchmark all 72 selectors per stock
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          BENCHMARK_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          BENCHMARK_MAX_TRAINING_ROWS: ${{ inputs.max_training_rows }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python python/stock_ml/benchmark_prediction.py
