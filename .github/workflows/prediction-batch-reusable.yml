name: Reusable Python stock prediction batch

on:
  workflow_call:
    inputs:
      batch_id:
        required: true
        type: string
      project_numbers:
        required: true
        type: string
      force_train:
        required: false
        default: false
        type: boolean
      force_calibrate:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: torn-helper-ml-prediction-batch-${{ inputs.batch_id }}
  cancel-in-progress: false

jobs:
  predict:
    name: Prediction batch ${{ inputs.batch_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check configuration
        env:
          PROJECTS: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
        run: |
          if [ -z "$PROJECTS" ]; then
            echo '::error::Add STOCK_ML_PROJECTS_JSON to repository Actions secrets.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Test prediction worker and models
        run: python -m unittest discover -s python/stock_ml -v
      - name: Restore public market-price cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .stock-ml-price-cache
          key: stock-market-prices-v1-${{ github.run_id }}-${{ inputs.batch_id }}
          restore-keys: stock-market-prices-v1-
      - name: Run assigned prediction batch
        id: cycle
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          PROJECT_NUMBERS: ${{ inputs.project_numbers }}
          SHORT_MIN_EXPECTED_NET_RETURN: ${{ vars.SHORT_MIN_EXPECTED_NET_RETURN || '0.002' }}
          SHORT_ESTIMATED_TRADING_COST: ${{ vars.SHORT_ESTIMATED_TRADING_COST || '0.002' }}
          ML_FORCE_TRAIN: ${{ inputs.force_train }}
          ML_FORCE_CALIBRATE: ${{ inputs.force_calibrate }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          config = json.loads(os.environ["STOCK_ML_PROJECTS_JSON"])
          allowed = {int(value) for value in os.environ["PROJECT_NUMBERS"].split(",")}
          selected = {str(key): value for key, value in config.items() if int(key) in allowed}
          if set(map(int, selected)) != allowed:
              missing = sorted(allowed - set(map(int, selected)))
              print(f"Missing configured Supabase projects for this batch: {missing}", file=sys.stderr)
              sys.exit(1)
          env = os.environ.copy()
          env["STOCK_ML_PROJECTS_JSON"] = json.dumps(selected)
          raise SystemExit(subprocess.call(
              [sys.executable, "python/stock_ml/actions_runner.py"], env=env
          ))
          PY
      - name: Save public market-price cache at most hourly
        if: always() && !cancelled() && steps.cycle.outputs.cache_save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .stock-ml-price-cache
          key: stock-market-prices-v1-${{ github.run_id }}-${{ inputs.batch_id }}
