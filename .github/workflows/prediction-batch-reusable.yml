name: Reusable stock prediction batch

on:
  workflow_call:
    inputs:
      batch_id:
        required: true
        type: string
      stock_ids:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: torn-helper-ml-prediction-batch-${{ inputs.batch_id }}
  cancel-in-progress: false

jobs:
  predict:
    name: Predict batch ${{ inputs.batch_id }} (stocks ${{ inputs.stock_ids }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Run stock predictions for batch
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          STOCK_IDS: ${{ inputs.stock_ids }}
          GITHUB_SHA: ${{ github.sha }}
        run: python python/stock_ml/prediction_runner.py
