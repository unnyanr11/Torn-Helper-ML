name: Reusable independent stock backtest

on:
  workflow_call:
    inputs:
      stock_id:
        required: true
        type: number
      lookback_days:
        required: false
        default: 180
        type: number
      evaluation_days:
        required: false
        default: 0
        type: number
      max_folds:
        required: false
        default: 30
        type: number
      backtest_workers:
        required: false
        default: 2
        type: number

permissions:
  contents: read

concurrency:
  group: torn-helper-ml-independent-stock-${{ inputs.stock_id }}
  cancel-in-progress: false

jobs:
  backtest:
    name: Independent backtest stock ${{ inputs.stock_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/stock_ml/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r python/stock_ml/requirements.txt
      - name: Run stock-specific walk-forward backtest
        env:
          STOCK_ML_PROJECTS_JSON: ${{ secrets.STOCK_ML_PROJECTS_JSON }}
          STOCK_IDS: ${{ inputs.stock_id }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          EVALUATION_DAYS: ${{ inputs.evaluation_days }}
          MAX_FOLDS: ${{ inputs.max_folds }}
          BACKTEST_WORKERS: ${{ inputs.backtest_workers }}
          ALLOW_CALIBRATION_PROMOTION: "false"
          GITHUB_SHA: ${{ github.sha }}
        run: python python/stock_ml/backtest_runner.py
